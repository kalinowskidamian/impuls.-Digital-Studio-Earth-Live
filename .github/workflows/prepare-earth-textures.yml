name: Prepare optimized Earth textures (QA)
on:
  push:
    branches: [QA]
    paths:
      - '.github/workflows/prepare-earth-textures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned source textures and optimize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p textures
          curl -fsSL --retry 3 https://unpkg.com/three-globe@2.45.6/example/img/earth-blue-marble.jpg -o /tmp/earth-blue-marble.jpg
          curl -fsSL --retry 3 https://unpkg.com/three-globe@2.45.6/example/img/earth-topology.png -o /tmp/earth-topology.png
          python3 -m venv /tmp/earth-textures-venv
          /tmp/earth-textures-venv/bin/pip install --quiet Pillow
          /tmp/earth-textures-venv/bin/python - <<'PY'
          from PIL import Image
          for name, ext, quality in [('earth-blue-marble','jpg',82),('earth-topology','png',88)]:
              with Image.open(f'/tmp/{name}.{ext}') as im:
                  print(name, im.size)
                  im.save(f'textures/{name}.webp', format='WEBP', quality=quality, method=6)
          PY
          wc -c /tmp/earth-blue-marble.jpg /tmp/earth-topology.png textures/*.webp
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-earth-textures
          path: textures/
          retention-days: 7
