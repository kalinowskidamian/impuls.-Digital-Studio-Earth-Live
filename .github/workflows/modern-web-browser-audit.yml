name: Browser audit (QA, Lighthouse)

on:
  push:
    branches: ['QA']
    paths:
      - '.github/workflows/modern-web-browser-audit.yml'
      - 'scripts/summarize-lighthouse.cjs'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse
        run: npm install --global --no-audit --no-fund lighthouse@latest
      - name: Compare previous and current QA in Chromium
        shell: bash
        env:
          AUDIT_DEVICE: ${{ matrix.device }}
        run: |
          mkdir -p browser-audit
          git worktree add --detach "$RUNNER_TEMP/earth-baseline" HEAD^
          git rev-parse HEAD^ HEAD | tee browser-audit/commits.txt
          lighthouse --version | tee browser-audit/lighthouse-version.txt
          python3 -m http.server 8765 --bind 127.0.0.1 --directory 'public' >/tmp/qa-http-server.log 2>&1 &
          current_server=$!
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$RUNNER_TEMP/earth-baseline/public" >/tmp/qa-baseline-server.log 2>&1 &
          baseline_server=$!
          trap 'kill "$current_server" "$baseline_server" 2>/dev/null || true' EXIT
          sleep 2
          entries=('baseline|8766' 'earth-live|8765')
          flags=()
          if [ "$AUDIT_DEVICE" = desktop ]; then flags+=(--preset=desktop); fi
          for item in "${entries[@]}"; do
            slug="${item%%|*}"
            port="${item#*|}"
            echo "::group::Lighthouse $AUDIT_DEVICE $slug"
            lighthouse "http://127.0.0.1:$port/" "${flags[@]}" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --max-wait-for-load=30000 \
              --output=json --output-path="$PWD/browser-audit/$slug.json" --quiet \
              >"browser-audit/$slug-run.log" 2>&1 || { tail -35 "browser-audit/$slug-run.log"; exit 1; }
            node scripts/summarize-lighthouse.cjs "browser-audit/$slug.json" "$AUDIT_DEVICE" | tee "browser-audit/$slug-summary.txt" >> "$GITHUB_STEP_SUMMARY"
            cat "browser-audit/$slug-summary.txt"
            echo "::endgroup::"
          done
      - name: Upload browser audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-audit-${{ matrix.device }}-${{ github.ref_name }}-${{ github.sha }}
          path: browser-audit/
          retention-days: 30
          if-no-files-found: warn
